# The gate: the unit tests, the typecheck, the production build and the
# end-to-end browser test, on every pull request.
#
# The deploy (pages.yml) still builds and tests on its own before it publishes,
# so a red test run never reaches GitHub Pages. This workflow is the one that
# tells you a pull request is broken while it is still a pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one run per branch; a newer push replaces a queued one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: end-to-end browser test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the test drives real Chrome through the character select into a match,
      # so it needs one on the runner
      - name: find Chrome
        id: chrome
        run: |
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$p" ]; then echo "path=$p" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "no chrome on this runner" >&2
          exit 1
      - run: npm run test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
